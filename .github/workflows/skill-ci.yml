name: sensewright-ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate Agent Skills metadata
        run: python scripts/validate_skills.py
      - name: Validate evaluation assets
        run: python scripts/validate_evals.py
